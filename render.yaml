services:
  - type: web
    name: formsaathi-admin
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: admin
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OCR_LANGS
        value: eng+hin
      - key: CLIENT_ORIGIN
        value: http://localhost:5173
